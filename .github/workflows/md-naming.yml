name: md-naming

# Deliberately a SEPARATE workflow from pre-commit.yml: one workflow per gate,
# so a naming failure is legible on its own rather than buried in a suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  md-naming:
    name: markdown naming convention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The gate and its exemption list live in the shared utils repo so every
      # repo enforces the same rule. Checking it out beats vendoring a copy,
      # which is how a gate and a survey start disagreeing.
      - name: Check out the shared gate
        uses: actions/checkout@v4
        with:
          repository: kuhyx/utils
          path: .utils

      - name: Enforce the naming convention
        run: bash .utils/scripts/check_md_naming.sh --all
